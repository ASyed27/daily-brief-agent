name: Daily Update to Dad

on:
  schedule:
    # GitHub cron is in UTC and does NOT observe US daylight saving time.
    # 13:00 UTC = 9:00 AM Eastern during EDT (mid-March -> early November).
    # During EST (winter) this fires at 8:00 AM ET — change to "0 14 * * *"
    # then if you want it to stay at 9:00 AM.
    - cron: '0 13 * * *'
  workflow_dispatch:  # lets you trigger a run manually from the Actions tab

jobs:
  send-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r week2/requirements.txt
      - run: python week2/daily_message.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAD_TELEGRAM_CHAT_ID: ${{ secrets.DAD_TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAD_GMAIL_ADDRESS: ${{ secrets.DAD_GMAIL_ADDRESS }}
          DAD_GMAIL_APP_PASSWORD: ${{ secrets.DAD_GMAIL_APP_PASSWORD }}
