name: Daily Brief

on:
  # Fired by an external scheduler (cron-job.org) via the GitHub API at 9:00 AM ET —
  # timezone-aware, so no daylight-saving drift and no GitHub queue delay. Also runnable
  # manually from the Actions tab.
  workflow_dispatch:

# Permissions the GitHub Pages deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  send-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r week2/requirements.txt

      - name: Send messages and build the dashboard
        run: python week2/daily_message.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RECIPIENT_TELEGRAM_CHAT_ID: ${{ secrets.RECIPIENT_TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_GMAIL_ADDRESS: ${{ secrets.RECIPIENT_GMAIL_ADDRESS }}
          RECIPIENT_GMAIL_APP_PASSWORD: ${{ secrets.RECIPIENT_GMAIL_APP_PASSWORD }}
          RECIPIENT_ICAL_URL: ${{ secrets.RECIPIENT_ICAL_URL }}

      # Publish the dashboard even if the messaging step errored — it's written first.
      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: week2/site

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
